<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tanuja Didi &amp; Riya Didi | Luxury Birthday Celebration</title>

  <!-- Luxury Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #0a0608;
      --burgundy: #3b0713;
      --burgundy-deep: #1c0208;
      --gold-primary: #d4af37;
      --gold-light: #f7e7ce;
      --gold-bright: #ffd700;
      --text-ivory: #faf6f0;
      --text-muted: #a08e82;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-ivory);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }

    /* Luxury Gold Foil Text */
    .gold-gradient-text {
      background: linear-gradient(135deg, #f7e7ce 0%, #ffd700 35%, #fff2b2 55%, #aa7c11 85%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Top Navigation Bar */
    header {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1rem 1.5rem;
      background: rgba(10, 6, 8, 0.92);
      border-bottom: 1px solid rgba(59, 7, 19, 0.8);
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-ivory);
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-btn {
      background: none;
      border: none;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .nav-btn.active, .nav-btn:hover {
      color: var(--gold-bright);
      border-bottom-color: var(--gold-bright);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-btn {
      background: var(--burgundy-deep);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      transform: scale(1.05);
    }

    /* Buttons */
    .btn-gold {
      background: linear-gradient(135deg, #ffd700 0%, #f7e7ce 50%, #d4af37 100%);
      color: #0a0608;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
      transition: all 0.2s ease;
    }

    .btn-gold:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-burgundy {
      background: var(--burgundy);
      color: var(--text-ivory);
      border: 1px solid rgba(212, 175, 55, 0.6);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-burgundy:hover {
      background: #520a1a;
      border-color: var(--gold-bright);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 20;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }

    /* 3D Perspective Box */
    .perspective-box {
      perspective: 1000px;
      width: 280px;
      height: 280px;
      margin: 1.5rem auto;
      position: relative;
    }

    .box-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease-out;
      transform: rotateX(-14deg) rotateY(22deg);
      cursor: pointer;
    }

    .box-base {
      position: absolute;
      top: 48px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: radial-gradient(circle at 35% 30%, #460917 0%, #29040d 60%, #110104 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 4px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    .box-ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      background: linear-gradient(90deg, #aa7c11, #ffd700, #fff2b2, #aa7c11);
    }

    .box-ribbon-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      background: linear-gradient(180deg, #aa7c11, #ffd700, #fff2b2, #aa7c11);
    }

    .box-lid {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: radial-gradient(circle at 40% 40%, #580d1e 0%, #30040d 70%, #160105 100%);
      border: 1px solid rgba(212, 175, 55, 0.6);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      transform-origin: top;
      transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .box-opened .box-lid {
      transform: translateY(-130px) rotateX(-50deg) rotateZ(15deg);
      opacity: 0.4;
    }

    .box-surprise {
      position: absolute;
      left: 50%;
      top: 30px;
      transform: translateX(-50%) translateY(40px) scale(0.6);
      width: 260px;
      background: radial-gradient(circle at 50% 20%, #2f0610 0%, #150206 100%);
      border: 1px solid var(--gold-bright);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
      opacity: 0;
      visibility: hidden;
      transition: all 0.9s ease-out;
      pointer-events: auto;
    }

    .box-opened .box-surprise {
      transform: translateX(-50%) translateY(-150px) scale(1);
      opacity: 1;
      visibility: visible;
    }

    /* Candle Animation */
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 12px rgba(255, 170, 0, 0.85)); }
      50% { transform: scale(1.05, 1.08) rotate(1.5deg); filter: drop-shadow(0 0 18px rgba(255, 190, 40, 0.95)); }
    }

    .flame {
      width: 14px;
      height: 28px;
      background: radial-gradient(ellipse at 50% 80%, #ffffff 0%, #fff275 25%, #ff9f1c 60%, #e71d36 90%, transparent 100%);
      border-radius: 50% 50% 35% 35% / 80% 80% 20% 20%;
      animation: flicker 1.8s infinite ease-in-out;
      margin: 0 auto;
    }

    /* Footer Controls */
    footer {
      position: relative;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: rgba(10, 6, 8, 0.92);
      border-top: 1px solid rgba(59, 7, 19, 0.8);
    }

    /* Interactive celebration upgrades */
    .cake-stage { width:min(560px, 94vw); margin:1.4rem auto 1rem; position:relative; height:300px; display:flex; align-items:flex-end; justify-content:center; }
    .cake-board { position:absolute; bottom:18px; width:330px; max-width:88vw; height:24px; border-radius:50%; background:linear-gradient(180deg,#f7e7ce,#a87925 55%,#3a1b12); box-shadow:0 15px 28px #0009; }
    .cake-body { position:absolute; bottom:40px; width:270px; height:150px; max-width:76vw; transition:transform 1s ease; filter:drop-shadow(0 16px 15px #0009); }
    .cake-tier { position:absolute; left:0; right:0; height:105px; bottom:0; border-radius:18px 18px 30px 30px; background:linear-gradient(90deg,#4b1020,#9c4253 22%,#f1c9b9 48%,#8a3045 75%,#3c0b18); border:2px solid #d4af37; overflow:hidden; }
    .cake-tier:before { content:""; position:absolute; left:0; right:0; top:0; height:25px; border-radius:50%; background:linear-gradient(180deg,#fff5e9,#e8b9a7 75%,#b66b70); box-shadow:0 4px 8px #2b0710; }
    .cake-tier:after { content:""; position:absolute; inset:32px 12px 10px; border-top:2px dashed #f7e7ce99; border-bottom:2px dashed #f7e7ce99; }
    .cake-topper { position:absolute; bottom:92px; left:50%; transform:translateX(-50%); width:190px; height:44px; border-radius:50%; background:linear-gradient(180deg,#fff0df,#d9a18f 75%,#7b2638); border:2px solid #d4af37; }
    .cake-berries { position:absolute; z-index:2; bottom:115px; left:50%; transform:translateX(-50%); font-size:25px; white-space:nowrap; filter:drop-shadow(0 2px 3px #0008); }
    .cake-candle { position:absolute; z-index:3; bottom:151px; left:50%; width:9px; height:42px; transform:translateX(-50%); border-radius:4px; background:repeating-linear-gradient(45deg,#fff0d0 0 7px,#b8862c 7px 13px); }
    .cake-candle[style*='--flame-off'] { opacity:.35; } .cake-candle[style*='--flame-off']:before { display:none; } .cake-candle:before { content:""; position:absolute; width:13px; height:22px; left:-2px; top:-21px; border-radius:50% 50% 45% 45%; background:radial-gradient(ellipse at 50% 70%,#fff 0 10%,#fff19a 30%,#ff9d28 65%,transparent 72%); animation:flicker .8s infinite alternate; filter:drop-shadow(0 0 9px #ffb52e); }
    .cake-cut-line { position:absolute; z-index:5; bottom:48px; left:50%; height:118px; width:3px; background:#fff3d5; opacity:0; transform:rotate(24deg); box-shadow:0 0 12px #ffd700; }
    .cake-slice { position:absolute; z-index:4; bottom:42px; left:calc(50% + 40px); width:90px; height:82px; opacity:0; transform:translate(0,0) rotate(0); transition:all 1s cubic-bezier(.2,.8,.2,1); clip-path:polygon(0 0,100% 25%,100% 100%,0 100%); background:linear-gradient(180deg,#f7d8c5 0 22%,#7e2037 23% 55%,#f1c7ac 56% 72%,#4c1020 73%); border:2px solid #d4af37; }
    .cake-stage.cut .cake-cut-line { opacity:1; animation:knifeCut .7s ease forwards; }
    .cake-stage.cut .cake-slice { opacity:1; transform:translate(75px,-12px) rotate(9deg); }
    .cake-stage.cut .cake-body { transform:translateX(-10px); }
    @keyframes knifeCut { from{transform:translateY(-45px) rotate(24deg)} to{transform:translateY(0) rotate(24deg)} }

    .photo-gallery { width:min(900px,100%); margin:1.5rem auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
    .photo-card { border:1px solid #d4af3780; border-radius:18px; padding:12px; background:linear-gradient(145deg,#310711,#120307); box-shadow:0 14px 35px #0008; }
    .photo-card.shared { grid-column:1/-1; max-width:620px; width:100%; justify-self:center; }
    .photo-frame { height:230px; border:2px solid #d4af37; border-radius:12px; overflow:hidden; background:radial-gradient(circle,#4b1722,#120307); display:flex; align-items:center; justify-content:center; color:#f7e7ce; position:relative; }
    .photo-frame img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-frame .placeholder { padding:1rem; font-family:'Cormorant Garamond',serif; font-size:1.2rem; }
    .photo-card h3 { font-family:'Cinzel',serif; color:#f7e7ce; margin:.8rem 0 .25rem; font-size:1rem; }
    .photo-note { color:var(--text-muted); font-size:.75rem; }
    #fireworkCanvas { position:fixed; inset:0; z-index:25; pointer-events:none; }
    .finale-glow { text-shadow:0 0 18px #ffd70088,0 0 42px #e65c9c66; }

    @media(max-width:760px) {
      header { flex-wrap:wrap; justify-content:center; gap:.75rem; padding:.85rem .75rem; }
      .brand-title { width:100%; text-align:center; font-size:.95rem; }
      .nav-links { order:3; width:100%; justify-content:flex-start; overflow-x:auto; gap:1rem; padding:.25rem .1rem .5rem; scrollbar-width:thin; }
      .nav-btn { font-size:.68rem; }
      .header-actions { position:absolute; right:.75rem; top:.7rem; }
      main { min-height:62vh; padding:1.4rem .8rem; }
      footer { gap:.5rem; padding:.85rem .75rem; }
      .perspective-box { width:250px; height:250px; }
      .photo-gallery { grid-template-columns:1fr; }
      .photo-card.shared { grid-column:auto; }
      .photo-frame { height:240px; }
      .cake-stage { height:270px; }
      .cake-board { width:290px; }
      .cake-body { width:235px; }
      .btn-gold,.btn-burgundy { padding:.7rem 1rem; font-size:.68rem; }
    }

    /* Champagne toast animation */
    .toast-animation { display:none; position:relative; width:min(100%,420px); height:190px; margin:1.5rem auto 0; overflow:hidden; }
    .toast-animation.show { display:block; }
    .toast-glass { position:absolute; top:32px; font-size:5.2rem; line-height:1; filter:drop-shadow(0 8px 12px #0008); }
    .toast-glass.left { left:calc(50% - 112px); }
    .toast-glass.right { right:calc(50% - 112px); transform:scaleX(-1); }
    .toast-animation.clinking .toast-glass.left { animation:glassLeft .75s ease-in-out; }
    .toast-animation.clinking .toast-glass.right { animation:glassRight .75s ease-in-out; }
    .toast-spark { position:absolute; left:50%; top:35px; transform:translateX(-50%) scale(.2); opacity:0; color:#ffe58a; font-size:2rem; text-shadow:0 0 18px #ffd700; }
    .toast-animation.clinking .toast-spark { animation:sparkPop .9s ease-out .48s both; }
    .toast-message { color:var(--gold-bright); font-family:Georgia,serif; font-style:italic; margin-top:0; opacity:0; }
    .toast-message.show { animation:toastFade .6s ease .45s forwards; }

    @keyframes glassLeft {
      0%,100% { transform:translateX(0) rotate(0); }
      45% { transform:translateX(36px) rotate(12deg); }
      65% { transform:translateX(30px) rotate(8deg); }
    }

    @keyframes glassRight {
      0%,100% { transform:scaleX(-1) translateX(0) rotate(0); }
      45% { transform:scaleX(-1) translateX(36px) rotate(12deg); }
      65% { transform:scaleX(-1) translateX(30px) rotate(8deg); }
    }

    @keyframes sparkPop {
      0% { opacity:0; transform:translateX(-50%) scale(.2); }
      35% { opacity:1; transform:translateX(-50%) scale(1.5); }
      100% { opacity:0; transform:translateX(-50%) scale(2.2) translateY(-18px); }
    }

    @keyframes toastFade { to { opacity:1; } }

    @media(prefers-reduced-motion:reduce) {
      .toast-animation.clinking .toast-glass,
      .toast-animation.clinking .toast-spark,
      .toast-message.show { animation:none; opacity:1; }
    }
  </style>
</head>
<body>
